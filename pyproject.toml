[project]
name = "hfcw"
version = "0.3.0"
description = "Hybrid Forward Collision Warning: classical FCW v2 + deep detector + KITTI evaluation"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.3",
    "opencv-python-headless>=4.8,<5",
    "pyyaml>=6",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
    "transformers>=4.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfcw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.uv]
# ultralytics가 끌어오는 opencv-python도 4.x로 고정 (5.0에서 HOGDescriptor 제거됨)
constraint-dependencies = ["opencv-python<5"]
